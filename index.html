<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A modern news dashboard for discovering the latest stories across India and the world." />
    <meta name="theme-color" content="#0b1220" />
    <title>PulseNews — Latest News</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="#" aria-label="PulseNews home">
          <span class="brand-mark">P</span>
          <span>Pulse<span>News</span></span>
        </a>
        <div class="header-actions">
          <button id="savedButton" class="ghost-button" type="button" aria-label="Show saved articles">
            <span>★</span> Saved <span id="savedCount" class="count-badge">0</span>
          </button>
          <button id="themeButton" class="icon-button" type="button" aria-label="Toggle theme">☾</button>
        </div>
      </div>
    </header>

    <main>
      <section class="hero">
        <div class="hero-copy">
          <p class="eyebrow">LIVE NEWS • INDIA</p>
          <h1>Stay informed.<br /><span>Stay ahead.</span></h1>
          <p class="hero-subtitle">Discover the stories that matter, curated across top categories and searchable in seconds.</p>
        </div>
        <form id="searchForm" class="search-box" role="search">
          <span class="search-icon">⌕</span>
          <input id="searchInput" type="search" placeholder="Search news, topics or headlines..." autocomplete="off" />
          <button type="submit">Search</button>
        </form>
      </section>

      <section class="toolbar" aria-label="News filters">
        <div id="optionsContainer" class="categories"></div>
        <div class="toolbar-right">
          <span id="resultLabel" class="result-label">Latest stories</span>
          <button id="refreshButton" class="refresh-button" type="button">↻ Refresh</button>
        </div>
      </section>

      <section id="status" class="status" aria-live="polite"></section>
      <section id="container" class="news-grid" aria-label="News articles"></section>
    </main>

    <footer class="site-footer">
      <span>PulseNews</span>
      <span>Built with HTML, CSS, JavaScript &amp; NewsAPI</span>
    </footer>

    <script src="api-key.js"></script>
    <script src="script.js"></script>
  </body>
</html>
